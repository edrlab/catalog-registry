version: 2
updates:
  # Base images in the Dockerfile, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # Workflow actions, pinned by commit digest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Python dependencies in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
