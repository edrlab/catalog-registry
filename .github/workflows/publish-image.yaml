name: publish-image
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read the repo only. Docker Hub push is authenticated via secrets, not GITHUB_TOKEN.
# Actions pinned by commit digest, not tag: a tag can move, a digest cannot.
permissions:
  contents: read

jobs:
  # Reuse the existing checks as reusable workflows instead of re-running the same steps
  # here: a red lint/test/schema run must block the image, not just block the merge button.
  lint:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-lint.yaml
  test:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-test.yaml
  schema:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-schema.yaml

  build-and-push:
    needs: [lint, test, schema]
    # Only the upstream repo publishes; forks (and forks' PRs, which don't get secrets) must not.
    if: |
      github.repository == 'edrlab/catalog-registry' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: edrlab/catalog-registry
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      # The immutable content digest, not a tag: what `deploy` below actually runs.
      # A tag (including `latest`) is a pointer that can move between build and deploy;
      # the digest cannot.
      digest: ${{ steps.build.outputs.digest }}

  # Roll the image just built onto the live Cloud Run service. Only on a real merge to
  # main, never for a PR's validation build. Auth is Workload Identity Federation, not a
  # long-lived service account key, per this repo's own deployment conventions.
  migrate:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      # ponytail: DSN comes from a GitHub secret, not Secret Manager — the project doesn't
      # have Secret Manager enabled yet and Cloud Run's own copy is still a plaintext env
      # var too. Move both to Secret Manager together when that's picked up as its own
      # piece of work; until then this is at least masked in logs same as the GCP path
      # would've been, GitHub auto-redacts `secrets.*` regardless.
      - name: Start Cloud SQL Auth Proxy (unix socket, same form the app itself uses)
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.25.4/cloud-sql-proxy.linux.amd64
          # Google doesn't publish a checksums file for this release channel. Pinned by
          # hand against the binary fetched 2026-09-15 — this at least catches the file
          # changing under the same version tag, not just a version bump.
          echo "b780c0d2c445ffd5d2fdba0925f2722c19fcd0d2c27c538e85713732698561f2  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          sudo mkdir -p /cloudsql && sudo chown "$USER" /cloudsql
          ./cloud-sql-proxy --unix-socket=/cloudsql \
            "${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" &
          sleep 3
      # If this fails, the workflow stops here: Cloud Run is untouched and the previous
      # revision keeps serving. Migrations are a gate, not a step folded into deploy.
      - run: uv run alembic upgrade head
        env:
          REGISTRY_DATABASE_URL: ${{ secrets.REGISTRY_DATABASE_URL }}

  deploy:
    needs: [build-and-push, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      # Deploy with zero traffic first, health-check the new revision directly by its own
      # tagged URL, and only shift prod traffic to it once that passes. Prod never serves
      # an unhealthy revision even briefly, and there's nothing to roll back on failure —
      # the previous revision was never touched, so no traffic-restoration logic needed.
      - name: Deploy new revision (no traffic yet)
        id: deploy
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="docker.io/edrlab/catalog-registry@${{ needs.build-and-push.outputs.digest }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --no-traffic --tag=ci-candidate --quiet
          REVISION=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.latestCreatedRevisionName)')
          CANDIDATE_URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="ci-candidate") | .url')
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
      - name: Poll the candidate revision's own URL before it takes traffic
        run: |
          for i in $(seq 1 12); do
            code=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null \
              -w '%{http_code}' "${{ steps.deploy.outputs.candidate_url }}/health/ready" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "candidate revision never returned 200 on /health/ready — leaving prod traffic untouched" >&2
          exit 1
      - name: Promote — shift all traffic to the new revision
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --to-revisions="${{ steps.deploy.outputs.revision }}=100"
      # Sanity check the real prod domain too, since it's what Thorium Reader actually
      # hits and the custom-domain mapping is one more hop than the candidate URL above.
      # Short retry, not a single shot — the candidate already passed its own health
      # check, so this is guarding against a transient blip, not re-litigating health.
      - name: Confirm prod domain reflects the promoted revision
        run: |
          for i in $(seq 1 3); do
            code=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null \
              -w '%{http_code}' "${{ vars.PROD_URL }}/health/ready" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "prod domain never returned 200 after promotion" >&2
          exit 1
