name: publish-image
on:
  push:
    branches: [main]

# Least privilege: read the repo, write packages (to push the image). Nothing else.
# Actions pinned by commit digest, not tag: a tag can move, a digest cannot.
permissions:
  contents: read
  packages: write

jobs:
  # Reuse the existing checks as reusable workflows instead of re-running the same steps
  # here: a red lint/test/schema run must block the image, not just block the merge button.
  lint:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-lint.yaml
  test:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-test.yaml
  schema:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-schema.yaml

  build-and-push:
    needs: [lint, test, schema]
    # Only the upstream repo publishes; forks pushing to their own main must not.
    if: github.repository == 'edrlab/catalog-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ghcr.io/edrlab/catalog-registry
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
