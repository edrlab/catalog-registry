name: publish-image
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read the repo only. Docker Hub push is authenticated via secrets, not GITHUB_TOKEN.
# Actions pinned by commit digest, not tag: a tag can move, a digest cannot.
permissions:
  contents: read

jobs:
  # Reuse the existing checks as reusable workflows instead of re-running the same steps
  # here: a red lint/test/schema run must block the image, not just block the merge button.
  lint:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-lint.yaml
  test:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-test.yaml
  schema:
    if: github.repository == 'edrlab/catalog-registry'
    uses: ./.github/workflows/ci-schema.yaml

  build-and-push:
    needs: [lint, test, schema]
    # Only the upstream repo publishes; forks (and forks' PRs, which don't get secrets) must not.
    if: |
      github.repository == 'edrlab/catalog-registry' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: edrlab/catalog-registry
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
