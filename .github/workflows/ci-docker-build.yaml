name: ci-docker-build
on: [pull_request, push]

# No Docker Hub push, no credentials needed - just prove the image still builds before
# merge, since Cloud Run's own build (Developer Connect) only runs after a push to main,
# too late to block a broken merge.
permissions:
  contents: read

# Lint, tests and schemas run in their own workflows on the same events; calling them from here as
# well ran the Postgres suite twice per push.
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
