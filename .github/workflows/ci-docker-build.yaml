name: ci-docker-build
on: [pull_request, push]

# No Docker Hub push, no credentials needed - just prove the image still builds before
# merge, since Cloud Run's own build (Developer Connect) only runs after a push to main,
# too late to block a broken merge.
permissions:
  contents: read

# Lint, tests and schemas run in their own workflows on the same events; calling them from here as
# well ran the Postgres suite twice per push.
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
