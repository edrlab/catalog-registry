name: ci-docker-build
on: [pull_request, push]

# No Docker Hub push, no credentials needed - just prove the image still builds before
# merge, since Cloud Run's own build (Developer Connect) only runs after a push to main,
# too late to block a broken merge.
permissions:
  contents: read

jobs:
  # Reused as reusable workflows so a red lint/test/schema run blocks the build check too,
  # same dependency shape the old publish-image.yaml used before Docker Hub push was removed.
  lint:
    uses: ./.github/workflows/ci-lint.yaml
  test:
    uses: ./.github/workflows/ci-test.yaml
  schema:
    uses: ./.github/workflows/ci-schema.yaml

  docker-build:
    needs: [lint, test, schema]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
