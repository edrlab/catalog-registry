name: ci-test
on: [pull_request, push, workflow_call]

# Least privilege: these jobs read the repository and nothing else.
# Actions are pinned by commit digest, not by tag: a tag can be moved to point at
# different code, a digest cannot.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U registry"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Actions already provides the container network and health-check wiring, so
      # testcontainers would be a second layer doing the same job. conftest.py switches on
      # this variable; locally, with it unset, testcontainers starts a container instead.
      TEST_DATABASE_URL: postgresql+asyncpg://registry:registry@localhost:5432/registry_test
      REGISTRY_DATABASE_URL: postgresql+asyncpg://registry:registry@localhost:5432/registry_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create extensions
        run: |
          PGPASSWORD=registry psql -h localhost -U registry -d registry_test \
            -f docker/postgres/init-extensions.sql
      - run: uv run pytest
