name: ci-audit
on:
  # `push` as well as `pull_request`, which does duplicate a run on a branch that has a PR
  # open. That is the price of a working status badge: a badge reads the default branch, and
  # a workflow that never runs there has no status to report.
  push:
  pull_request:
  schedule:
    # An advisory published today should not wait for the next pull request.
    - cron: "0 6 * * 1"

# Actions are pinned by commit digest, not by tag: a tag can be moved to point at
# different code, a digest cannot.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      # Runtime dependencies only, and reporting rather than gating. A blocking check on a
      # two-person project mostly stalls pull requests over advisories in transitive test
      # dependencies that production never reaches.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project > runtime-requirements.txt
      - run: uvx pip-audit -r runtime-requirements.txt
        continue-on-error: true
