name: ci-audit
on:
  # No `push`: the advisory set does not change between a push and its pull request.
  pull_request:
  schedule:
    # An advisory published today should not wait for the next pull request.
    - cron: "0 6 * * 1"

# Actions are pinned by commit digest, not by tag: a tag can be moved to point at
# different code, a digest cannot.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      # Runtime dependencies only. `conventions/security.md` §8: review, do not gate — a
      # blocking check on a two-person project mostly stalls PRs over advisories in
      # transitive test dependencies that production never reaches.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project > runtime-requirements.txt
      - run: uvx pip-audit -r runtime-requirements.txt
        continue-on-error: true
