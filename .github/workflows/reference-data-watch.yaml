name: reference-data-watch
on:
  # CLDR publishes twice a year and pycountry follows ISO; weekly is plenty.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Reads the pins, asks GitHub and PyPI for the latest releases, and opens one issue when something
# newer is out. It never changes data: a new release is processed by hand as a data migration.
permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - id: check
        run: uv run --no-project python scripts/check_reference_sources.py --github-output "$GITHUB_OUTPUT"
      - if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Reference data: a newer CLDR or pycountry release is out"
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$TITLE" --body "$REPORT"
          fi
