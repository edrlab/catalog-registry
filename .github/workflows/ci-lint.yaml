name: ci-lint
on: [pull_request, push]

# Least privilege: these jobs read the repository and nothing else.
# Actions are pinned by commit digest, not by tag: a tag can be moved to point at
# different code, a digest cannot.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      # --locked, not --frozen: a uv.lock that no longer matches pyproject.toml fails here.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
