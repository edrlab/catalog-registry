name: ci-schema
on: [pull_request, push]

# Least privilege: these jobs read the repository and nothing else.
# Actions are pinned by commit digest, not by tag: a tag can be moved to point at
# different code, a digest cannot.
permissions:
  contents: read

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Schemas are valid draft-07
        run: uv run python scripts/validate_schemas.py
      - name: Every demo fixture validates
        run: uv run python scripts/validate_fixtures.py demo
      - name: domain/enums.py matches the schema
        run: uv run python scripts/generate_enums.py && git diff --exit-code
      - name: The relaxed seed schema matches the published ones (ADR-030)
        run: uv run python scripts/generate_seed_schema.py && git diff --exit-code
      - name: data/recommended.json validates as seed input
        run: uv run python scripts/validate_fixtures.py demo
