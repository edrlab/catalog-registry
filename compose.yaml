name: catalog-registry

services:
  db:
    # TIN's open-source stand-in (PlanetScale's BM25 search index), on the official Postgres 18
    # image. Not for production: it scans every row. Pinned by digest.
    image: planetscale/lead:pg18@sha256:ebb795acccd7f7bdabc009ca9490b73c4dbb216f61bc4ebcc4d95e284cc96b76
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    volumes:
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      REGISTRY_DATABASE_URL: postgresql+asyncpg://registry:registry@db:5432/registry
    # condition: service_healthy, not a bare depends_on — Compose otherwise starts the API
    # as soon as the container exists, seconds before Postgres accepts connections.
    depends_on:
      db:
        condition: service_healthy
