<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry dev console</title>
<style>
:root{--bg:#f5f5f7;--glow1:rgba(10,132,255,.14);--glow2:rgba(175,82,222,.10);--glow3:rgba(52,199,89,.08);--surface:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--acc:#0a84ff;--acc-fg:#fff;--tint:#e8f1ff;--bad:#d93025;--ok:#188038;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0f;--glow1:rgba(10,132,255,.22);--glow2:rgba(191,90,242,.14);--glow3:rgba(48,209,88,.08);--surface:#1c1c1e;--fg:#f5f5f7;--mut:#98989f;--line:#2c2c2e;--acc:#0a84ff;--tint:#10294a;--bad:#ff6961;--ok:#5ad88a;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Google Sans","Segoe UI",Roboto,system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;min-height:100vh;background:radial-gradient(900px 500px at 8% -5%,var(--glow1),transparent 60%),radial-gradient(800px 480px at 95% 0%,var(--glow2),transparent 60%),radial-gradient(900px 600px at 50% 110%,var(--glow3),transparent 60%),var(--bg);background-attachment:fixed}
header{padding:28px 20px 8px;max-width:880px;margin:auto}
header b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.tag{display:inline-block;margin:6px 8px 0 0;background:var(--tint);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
#sum{font-size:13px}
main{padding:12px 20px 48px;max-width:880px;margin:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
#modes{display:inline-flex;background:var(--line);border-radius:10px;padding:2px;gap:2px}
#modes button{border:0;background:transparent;border-radius:8px;padding:6px 16px;font-weight:500;color:var(--fg)}
#modes button.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
input,select,button{font:inherit;color:var(--fg)}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--tint)}
input[type=search]{flex:1;min-width:220px}
label{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:500;transition:filter .15s,background .15s}
button:hover{filter:brightness(.97)}
button.go{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
#meta{background:var(--surface);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow);margin:4px 0 14px;font-size:13px}
#meta:empty{display:none}
.card{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;background:var(--tint);color:var(--acc);border-radius:999px;padding:2px 10px;margin:8px 6px 0 0;font-size:12px;font-weight:500}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
a.l{color:var(--acc);cursor:pointer;font-weight:500;text-decoration:none}a.l:hover{text-decoration:underline}
pre{overflow:auto;background:var(--surface);border-radius:12px;padding:12px;max-height:360px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:var(--shadow)}
details{background:var(--surface);border-radius:var(--r);padding:12px 16px;margin:12px 0;box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:600}details pre{box-shadow:none;background:var(--bg);margin:10px 0 0}
#cmp table{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:12px 0}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:10px 14px;text-align:left;font-size:13px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
@media(max-width:560px){header b{font-size:24px}td,th{padding:8px}}
</style>
</head>
<body>
<header><b>Registry dev console</b><span class="tag">Local only</span><span class="mut" id="sum"></span></header>
<main>
<div class="row" id="modes"></div>
<div class="row">
  <input type="search" id="q" placeholder="search text, e.g. paris (filters like the apps type them)" autocomplete="off">
  <input id="cid" placeholder="catalog id (uuid)" size="38" hidden>
  <button class="go" id="go">Send</button>
</div>
<div class="row">
  <label>Client <select id="client"></select></label>
  <label>Accept-Language <select id="lang">
    <option value="">(none)</option><option>fr</option><option>en</option><option>fr-FR,fr;q=0.9,en;q=0.5</option><option>en-US,en;q=0.9</option><option>de,fr;q=0.5</option><option>*</option>
  </select></label>
  <button id="all">Compare all clients</button>
</div>
<div id="meta" class="mut"></div>
<div id="out"></div>
<div id="cmp"></div>
<details><summary>Request and response headers</summary><pre id="hdr"></pre></details>
<details><summary>Raw JSON</summary><pre id="raw"></pre></details>
</main>
<script>
const $=id=>document.getElementById(id);
let mode='feed',clients={};
const MODES={feed:'Recommended feed',search:'Search',catalog:'One catalog'};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function buildPath(){
  if(mode==='feed')return'/';
  if(mode==='catalog')return'/catalogs/'+$('cid').value.trim();
  const p=new URLSearchParams();
  if($('q').value)p.set('query',$('q').value);
  return'/search?'+p;
}
async function sim(path,client){
  const p=new URLSearchParams({path,client,language:$('lang').value});
  const r=await fetch('/dev/simulate?'+p);
  const j=await r.json();
  if(!r.ok)throw new Error(JSON.stringify(j.detail||j));
  return j;
}
function links(j,rel){return(j.body.links||[]).filter(l=>l.rel===rel||(l.rel||[]).includes?.(rel))}
function card(cat){
  const m=cat.metadata||cat,c=el('div','card'),h=el('h3',null,m.title||'(untitled)');c.append(h);
  const self=(cat.links||[]).find(l=>l.rel==='self'||(l.rel||[]).includes?.('self'));
  const bits=[m.description,[].concat(m.language||[]).join(', '),m.country].filter(Boolean);
  if(bits.length)c.append(el('div','mut',bits.join(' · ')));
  for(const k of[].concat(m.kind||[]))c.append(el('span','chip',k));
  if(self){const a=el('a','l','open');a.onclick=()=>{setMode('catalog');$('cid').value=(self.href.match(/[0-9a-f-]{36}/)||[''])[0];send()};c.append(' ',a)}
  return c;
}
function show(j){
  const ok=j.status<400;
  $('meta').innerHTML='';
  const s=el('span',ok?'ok':'bad',`HTTP ${j.status}`);
  $('meta').append(s,` · ${j.client} · ${j.encoding||'identity'} · wire ${j.wire_bytes} B / decoded ${j.decoded_bytes} B · ${j.ms} ms`);
  const out=$('out');out.innerHTML='';
  const b=j.body;
  if(j.is_json&&b){
    const cats=b.catalogs||b.publications||[];
    if(b.metadata?.numberOfItems!=null)out.append(el('div','mut',`${b.metadata.numberOfItems} results · page ${b.metadata.currentPage??1}`));
    cats.forEach(c=>out.append(card(c)));
    if(!cats.length&&b.metadata&&b.metadata.title&&mode==='catalog')out.append(card(b));
    const nav=el('div','row');
    for(const rel of['previous','next','first','last']){
      const l=(b.links||[]).find(x=>x.rel===rel||(x.rel||[]).includes?.(rel));
      if(l){const bt=el('button',null,rel);bt.onclick=()=>follow(l.href);nav.append(bt)}
    }
    out.append(nav);
  }else out.append(el('pre',null,String(b)));
  $('hdr').textContent=JSON.stringify({request:j.request,response:j.headers},null,2);
  $('raw').textContent=j.is_json?JSON.stringify(b,null,2):String(b);
}
function follow(href){
  const u=new URL(href,location.origin);
  if(u.pathname==='/search'){setMode('search');const p=u.searchParams;
    $('q').value=p.get('query')||''}
  run(u.pathname+u.search);
}
async function run(path){
  try{show(await sim(path,$('client').value))}catch(e){$('meta').textContent='';$('out').replaceChildren(el('pre','bad',e.message))}
}
function send(){run(buildPath())}
async function compare(){
  const path=buildPath(),t=el('table');
  t.innerHTML='<tr><th>client</th><th>status</th><th>encoding</th><th>wire B</th><th>decoded B</th><th>ratio</th><th>ms</th></tr>';
  for(const k of Object.keys(clients)){
    const tr=el('tr');
    try{const j=await sim(path,k);
      [clients[k].label,j.status,j.encoding||'identity',j.wire_bytes,j.decoded_bytes,(j.wire_bytes/Math.max(j.decoded_bytes,1)).toFixed(2),j.ms].forEach(v=>tr.append(el('td',null,v)));
    }catch(e){tr.append(el('td',null,k),el('td','bad',e.message))}
    t.append(tr);
  }
  $('cmp').replaceChildren(t);
}
function setMode(m){
  mode=m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('q').hidden=m!=='search';
  $('cid').hidden=m!=='catalog';
}
(async()=>{
  for(const[m,l]of Object.entries(MODES)){const b=el('button',null,l);b.dataset.m=m;b.onclick=()=>{setMode(m);if(m==='feed')send()};$('modes').append(b)}
  clients=await(await fetch('/dev/clients')).json();
  for(const[k,c]of Object.entries(clients)){const o=el('option',null,c.label);o.value=k;$('client').append(o)}
  $('go').onclick=send;$('all').onclick=compare;
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  $('sum').textContent='Calls the app in-process with each reader’s real headers. Not available outside local.';
  setMode('feed');send();
})();
</script>
</body>
</html>
