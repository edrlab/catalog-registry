[project]
name = "catalog-registry"
version = "0.1.0"
description = "EDRLab OPDS Catalog Registry"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.52.4,<0.53",
    "jsonschema>=4.26.0,<5",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.19.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.16.4,<0.17",
    "mypy>=1.14",
    "types-jsonschema>=4.26.0.20260518",
    "testcontainers[postgres]>=4.15.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtin shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes
    "T20",         # print statements
    "SIM",         # simplify
    "TC",          # type-checking imports
    "PTH",         # pathlib over os.path
    "ERA",         # commented-out code
    "PL",          # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",     # many arguments — FastAPI dependencies legitimately have them
]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["PLR2004", "S101"]   # magic numbers and assert are fine in tests
"migrations/*" = ["ERA", "N999"]       # revision ids are not valid identifiers
"scripts/*"          = ["T20", "BLE001"]  # CLI validators report to stdout by design
"src/registry/cli/*" = ["T20"]   # a CLI reports to stdout; T20 guards the request path

[tool.ruff.lint.isort]
known-first-party = ["registry", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
asyncio_mode = "auto"
# Both function-scoped. `conventions/tooling.md` pairs a session fixture loop with a
# function test loop, which is right when async fixtures are session-scoped (a shared
# engine). Every async fixture here is per-test, so a session fixture loop would build
# asyncpg connections on one loop and use them on another — "attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
markers = [
    "unit: no I/O",
    "integration: requires a database",
    "contract: validates against schema/",
    "e2e: full HTTP path",
    "architecture: import boundary checks",
]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# No __init__.py anywhere: registry is an implicit namespace package (PEP 420), so mypy
# needs to be told where the package root is or it maps src/registry/core/x.py to both
# "x" and "registry.core.x".
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
